# Gradle daemon heap. Give it room so KSP/Room annotation processing is stable.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true

# Kotlin/KSP runs in its own compile daemon. Without an explicit heap it can die
# on startup ("Kotlin compile daemon terminated unexpectedly ... error code 0")
# during :app:kspDebugKotlin. Give it a dedicated, healthy heap.
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Configuration cache is intentionally OFF: it adds fragility with AGP + KSP on a
# fresh project and provides no benefit for the MVP. Re-enable later if desired.

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
